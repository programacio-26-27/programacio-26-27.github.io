<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Circuit">
  <rect width="64" height="64" rx="14" fill="#1c2130"/>
  <!-- Traçat del circuit en forma de C: base blanca + vorada (kerb) vermella -->
  <path d="M46 18.5 A19 19 0 1 0 46 45.5" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="butt"/>
  <path d="M46 18.5 A19 19 0 1 0 46 45.5" fill="none" stroke="#e63946" stroke-width="8" stroke-dasharray="5 5" stroke-linecap="butt"/>
  <!-- El cotxe: el punt groc que avança -->
  <circle cx="46" cy="45.5" r="5.5" fill="#ffb703" stroke="#1c2130" stroke-width="2"/>
</svg>
