        <div style=\"color:#6f67a0;font-size:25px;\">// accés a la sala<\u002Fdiv>\n        <div style=\"margin-top:12px;\"><span style=\"color:#5ef58c;\">si<\u002Fspan> esSoci <span style=\"color:#ffd23f;\">AND<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:64px;\">(teReserva <span style=\"color:#ffd23f;\">OR<\u002Fspan> hiHaPlaces)<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">llavors<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:40px;color:#d7d2ff;\">obrir_porta()<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">fi si<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center;\">\n        <p style=\"font-size:32px;line-height:1.5;color:#d7d2ff;margin:0;\">Cal ser <strong style=\"color:#5ef58c;\">soci<\u002Fstrong> i, a més, <strong style=\"color:#5ef58c;\">tenir reserva o que quedin places<\u002Fstrong>.<\u002Fp>\n        <p style=\"font-size:28px;line-height:1.5;color:#9a93c9;margin:0;\">Els parèntesis agrupen igual que a l'aritmètica: primer es resol l'<span style=\"font-family:'VT323',monospace;color:#ffd23f;\">OR<\u002Fspan> de dins, després l'<span style=\"font-family:'VT323',monospace;color:#ffd23f;\">AND<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"05 · Portes\" data-screen-label=\"Secció 05 Portes lògiques\" data-speaker-notes=\"Cinquena secció. Sorpresa: aquesta lògica no és només programari. Dins el processador hi ha milions de circuits que fan exactament AND, OR i NOT amb electricitat.\" style=\"height:100%;box-sizing:border-box;background:#1a0b2e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;justify-content:center;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:118px;font-weight:400;color:#5ef58c;line-height:1;letter-spacing:-0.02em;\">05<\u002Fdiv>\n    <h2 style=\"font-family:'Press Start 2P',cursive;font-size:40px;font-weight:400;margin:20px 0 0;line-height:1.25;\">Portes lògiques<\u002Fh2>\n    <p style=\"font-size:36px;color:#9a93c9;margin:24px 0 0;max-width:62%;\">La mateixa lògica, però feta de circuits dins el processador.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"De la lògica al maquinari\" data-screen-label=\"De la lògica al maquinari\" data-speaker-notes=\"Pont conceptual clau. Cert/fals es representen amb voltatge: 1 = hi ha corrent, 0 = no n'hi ha. Una porta lògica és un circuit minúscul que aplica una operació lògica a aquests senyals. El processador n'apila milions.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">05 · PORTES LÒGIQUES<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 44px;line-height:1.05;\">De cert/fals a corrent elèctric<\u002Fh2>\n    <div style=\"display:flex;gap:36px;flex:1;align-items:stretch;\">\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:40px;display:flex;flex-direction:column;gap:18px;justify-content:center;\">\n        <div style=\"font-family:'VT323',monospace;font-size:80px;font-weight:700;color:#5ef58c;\">1<\u002Fdiv>\n        <div style=\"font-size:30px;color:#d7d2ff;\">cert · hi ha corrent<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:40px;display:flex;flex-direction:column;gap:18px;justify-content:center;\">\n        <div style=\"font-family:'VT323',monospace;font-size:80px;font-weight:700;color:#6f67a0;\">0<\u002Fdiv>\n        <div style=\"font-size:30px;color:#9a93c9;\">fals · no hi ha corrent<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1.6;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:18px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;letter-spacing:.08em;\">UNA PORTA LÒGICA<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.5;color:#d7d2ff;margin:0;\">És un <strong style=\"color:#5ef58c;\">circuit<\u002Fstrong> que rep senyals d'entrada (0 o 1) i en produeix un de sortida segons una operació lògica.<\u002Fp>\n        <p style=\"font-size:27px;line-height:1.5;color:#9a93c9;margin:0;\">Un processador moderns n'apila <strong style=\"color:#fff;\">milers de milions<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Portes bàsiques\" data-screen-label=\"Portes bàsiques AND OR NOT\" data-speaker-notes=\"Les mateixes tres operacions, ara com a components. El símbol normalitzat (forma D per AND, escut per OR, triangle amb bombolla per NOT) és el que veuran en qualsevol esquema de circuits. La taula de veritat és idèntica a la dels operadors lògics.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">05 · PORTES LÒGIQUES<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 34px;line-height:1.05;\">Les tres portes bàsiques<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:30px;flex:1;align-content:center;\">\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;display:flex;flex-direction:column;align-items:center;gap:22px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:34px;color:#5ef58c;font-weight:700;\">AND<\u002Fdiv>\n        <svg width=\"200\" height=\"110\" viewBox=\"0 0 200 110\"><line x1=\"6\" y1=\"38\" x2=\"55\" y2=\"38\" stroke=\"#5ef58c\" stroke-width=\"3\"><\u002Fline><line x1=\"6\" y1=\"72\" x2=\"55\" y2=\"72\" stroke=\"#5ef58c\" stroke-width=\"3\"><\u002Fline><path d=\"M55 22 H105 A33 33 0 0 1 105 88 H55 Z\" fill=\"none\" stroke=\"#e8e6ff\" stroke-width=\"3\"><\u002Fpath><line x1=\"138\" y1=\"55\" x2=\"194\" y2=\"55\" stroke=\"#5ef58c\" stroke-width=\"3\"><\u002Fline><\u002Fsvg>\n        <div style=\"font-size:26px;color:#9a93c9;text-align:center;\">surt <span style=\"color:#fff;\">1<\u002Fspan> només si <span style=\"color:#fff;\">A i B<\u002Fspan> són 1<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;display:flex;flex-direction:column;align-items:center;gap:22px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:34px;color:#5ef58c;font-weight:700;\">OR<\u002Fdiv>\n        <svg width=\"200\" height=\"110\" viewBox=\"0 0 200 110\"><line x1=\"6\" y1=\"38\" x2=\"58\" y2=\"38\" stroke=\"#5ef58c\" stroke-width=\"3\"><\u002Fline><line x1=\"6\" y1=\"72\" x2=\"58\" y2=\"72\" stroke=\"#5ef58c\" stroke-width=\"3\"><\u002Fline><path d=\"M48 22 Q86 22 128 55 Q86 88 48 88 Q66 55 48 22 Z\" fill=\"none\" stroke=\"#e8e6ff\" stroke-width=\"3\"><\u002Fpath><line x1=\"128\" y1=\"55\" x2=\"194\" y2=\"55\" stroke=\"#5ef58c\" stroke-width=\"3\"><\u002Fline><\u002Fsvg>\n        <div style=\"font-size:26px;color:#9a93c9;text-align:center;\">surt <span style=\"color:#fff;\">1<\u002Fspan> si <span style=\"color:#fff;\">A o B<\u002Fspan> és 1<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;display:flex;flex-direction:column;align-items:center;gap:22px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:34px;color:#5ef58c;font-weight:700;\">NOT<\u002Fdiv>\n        <svg width=\"200\" height=\"110\" viewBox=\"0 0 200 110\"><line x1=\"6\" y1=\"55\" x2=\"58\" y2=\"55\" stroke=\"#5ef58c\" stroke-width=\"3\"><\u002Fline><path d=\"M58 30 L118 55 L58 80 Z\" fill=\"none\" stroke=\"#e8e6ff\" stroke-width=\"3\"><\u002Fpath><circle cx=\"128\" cy=\"55\" r=\"9\" fill=\"none\" stroke=\"#e8e6ff\" stroke-width=\"3\"><\u002Fcircle><line x1=\"137\" y1=\"55\" x2=\"194\" y2=\"55\" stroke=\"#5ef58c\" stroke-width=\"3\"><\u002Fline><\u002Fsvg>\n        <div style=\"font-size:26px;color:#9a93c9;text-align:center;\"><span style=\"color:#fff;\">inverteix<\u002Fspan> el senyal d'entrada<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Portes derivades\" data-screen-label=\"Portes derivades NAND NOR XOR\" data-speaker-notes=\"Combinant les bàsiques en surten de noves. NAND i NOR són AND/OR amb un NOT a la sortida (la bombolla). XOR (o-exclusiva) surt 1 quan les entrades són DIFERENTS: és el cor de la suma binària. NAND és universal: amb només NAND es pot construir qualsevol circuit.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">05 · PORTES LÒGIQUES<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 30px;line-height:1.05;\">Portes derivades<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;flex:1;align-content:center;\">\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:32px;color:#5ef58c;font-weight:700;\">NAND<\u002Fdiv>\n        <div style=\"font-size:27px;color:#d7d2ff;line-height:1.4;\"><span style=\"font-family:'VT323',monospace;\">AND<\u002Fspan> + <span style=\"font-family:'VT323',monospace;\">NOT<\u002Fspan>: la sortida invertida de l'AND.<\u002Fdiv>\n        <div style=\"font-size:25px;color:#9a93c9;margin-top:auto;\">surt 0 només si A i B són 1<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:32px;color:#5ef58c;font-weight:700;\">NOR<\u002Fdiv>\n        <div style=\"font-size:27px;color:#d7d2ff;line-height:1.4;\"><span style=\"font-family:'VT323',monospace;\">OR<\u002Fspan> + <span style=\"font-family:'VT323',monospace;\">NOT<\u002Fspan>: la sortida invertida de l'OR.<\u002Fdiv>\n        <div style=\"font-size:25px;color:#9a93c9;margin-top:auto;\">surt 1 només si A i B són 0<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:32px;color:#5ef58c;font-weight:700;\">XOR<\u002Fdiv>\n        <div style=\"font-size:27px;color:#d7d2ff;line-height:1.4;\">O-exclusiva: surt 1 quan les entrades són <strong style=\"color:#fff;\">diferents<\u002Fstrong>.<\u002Fdiv>\n        <div style=\"font-size:25px;color:#9a93c9;margin-top:auto;\">és el cor de la suma binària<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:27px;color:#9a93c9;margin:26px 0 0;\">Curiositat: amb només portes <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">NAND<\u002Fspan> es pot construir qualsevol circuit digital.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Laboratori\" data-screen-label=\"Laboratori portes interactiu\" data-speaker-notes=\"Demostració interactiva: a dalt tries la porta (AND, OR, NAND, NOR, XOR) i a sota cliques les entrades A i B per canviar-les entre 0 i 1. Cada entrada té a més un botó NOT que la inverteix abans d'entrar a la porta — és així com es construeixen NAND i NOR. La sortida i la fila activa de la taula s'actualitzen soles. Convida un alumne a predir la sortida abans de clicar.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:80px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:14px;\"><span style=\"font-family:'Press Start 2P',cursive;font-size:12px;color:#05140d;background:#5ef58c;padding:6px 16px;border-radius:0;letter-spacing:.1em;\">INTERACTIU<\u002Fspan><span style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;\">05 · PORTES LÒGIQUES<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:54px;font-weight:600;margin:0 0 10px;line-height:1.05;\">Laboratori: tria la porta, inverteix les entrades<\u002Fh2>\n    <p style=\"font-size:26px;color:#9a93c9;margin:0 0 28px;\">Tria una <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">porta<\u002Fspan> a dalt i clica els cercles <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">A<\u002Fspan> i <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">B<\u002Fspan>. El botó <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">NOT<\u002Fspan> de cada entrada la inverteix abans d'entrar a la porta.<\u002Fp>\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;\">\n      <logic-playground gate=\"AND\"><\u002Flogic-playground>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Tot connecta\" data-screen-label=\"Recap tot connecta\" data-speaker-notes=\"Recapitulació del fil conductor. Tot el que hem vist és la mateixa idea a nivells diferents: les variables guarden, els operadors combinen, les condicions decideixen amb lògica, i aquesta mateixa lògica viu al maquinari com a portes. Una sola cadena: del pseudocodi als circuits.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">SÍNTESI<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 50px;line-height:1.05;\">Tot connecta<\u002Fh2>\n    <div style=\"display:flex;align-items:stretch;gap:14px;flex:1;align-items:center;\">\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:28px 22px;text-align:center;\"><div style=\"font-family:'VT323',monospace;font-size:24px;color:#5ef58c;margin-bottom:10px;\">VARIABLES<\u002Fdiv><div style=\"font-size:24px;color:#9a93c9;line-height:1.4;\">guarden dades<\u002Fdiv><\u002Fdiv>\n      <div style=\"color:#5ef58c;font-size:34px;\">→<\u002Fdiv>\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:28px 22px;text-align:center;\"><div style=\"font-family:'VT323',monospace;font-size:24px;color:#5ef58c;margin-bottom:10px;\">OPERADORS<\u002Fdiv><div style=\"font-size:24px;color:#9a93c9;line-height:1.4;\">les combinen<\u002Fdiv><\u002Fdiv>\n      <div style=\"color:#5ef58c;font-size:34px;\">→<\u002Fdiv>\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:28px 22px;text-align:center;\"><div style=\"font-family:'VT323',monospace;font-size:24px;color:#5ef58c;margin-bottom:10px;\">CONDICIONS<\u002Fdiv><div style=\"font-size:24px;color:#9a93c9;line-height:1.4;\">decideixen<\u002Fdiv><\u002Fdiv>\n      <div style=\"color:#5ef58c;font-size:34px;\">→<\u002Fdiv>\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:28px 22px;text-align:center;\"><div style=\"font-family:'VT323',monospace;font-size:24px;color:#5ef58c;margin-bottom:10px;\">PORTES<\u002Fdiv><div style=\"font-size:24px;color:#9a93c9;line-height:1.4;\">ho fan amb circuits<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:30px;color:#d7d2ff;margin:50px 0 0;line-height:1.5;max-width:80%;\">La mateixa lògica de <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">cert<\u002Fspan> i <span style=\"font-family:'VT323',monospace;\">fals<\u002Fspan> recorre tot el camí: del pseudocodi que escrius fins als circuits que l'executen.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Per practicar\" data-screen-label=\"Per practicar tancament\" data-speaker-notes=\"Tancament i feina per casa. Proposa tres reptes de dificultat creixent perquè consolidin. Obre torn de preguntes.\" style=\"height:100%;box-sizing:border-box;background:#1a0b2e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;justify-content:space-between;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;\">PER PRACTICAR<\u002Fdiv>\n    <div>\n      <h2 style=\"font-size:64px;font-weight:700;margin:0 0 44px;line-height:1.05;\">Tres reptes per consolidar<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:24px;\">\n        <div style=\"display:flex;gap:26px;align-items:baseline;\"><span style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">01<\u002Fspan><div style=\"font-size:32px;color:#d7d2ff;\">Escriu el pseudocodi que digui si un any és de traspàs (pista: <span style=\"font-family:'VT323',monospace;color:#fff;\">mod 4<\u002Fspan>).<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:26px;align-items:baseline;\"><span style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">02<\u002Fspan><div style=\"font-size:32px;color:#d7d2ff;\">Dibuixa la taula de veritat de <span style=\"font-family:'VT323',monospace;color:#fff;\">(A AND B) OR NOT C<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:26px;align-items:baseline;\"><span style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">03<\u002Fspan><div style=\"font-size:32px;color:#d7d2ff;\">Combina portes per encendre una alarma si <span style=\"font-family:'VT323',monospace;color:#fff;\">(finestra OR porta) AND nit<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'VT323',monospace;font-size:26px;color:#6f67a0;border-top:1px solid #3a2f73;padding-top:26px;\">Preguntes? · Fonaments de la programació<\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
