document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ba48dd9b-d77f-478c-a4ea-0d3c1d88f1b4\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"32d7b266-7062-4afb-878c-1538ea6e3cd7\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"bad706bc-c6c2-4e0c-8d50-cff87bbd2ba0\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d939f786-8eb0-4a18-9141-10a7345b220b\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1ea57316-9893-4447-9fb2-49c16245143d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"97e81f9d-1bd3-414b-9aa5-54da6b91adde\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"15d5371b-e82e-4275-938a-e4ade4a9f329\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b5f273d6-7314-41f8-b4e2-b7e866bb5262\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"181810e5-7e61-45cc-b475-d00e6faac8e7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{ box-sizing:border-box; }\n  body{ margin:0; background:#0e0b1e; }\n  @keyframes lp-pop{ 0%{ transform:scale(0.6); } 60%{ transform:scale(1.12); } 100%{ transform:scale(1); } }\n  @keyframes lp-glow{ from{ opacity:.55; } to{ opacity:1; } }\n  @keyframes crt-flicker{ 0%,100%{ opacity:.92; } 50%{ opacity:1; } }\n  /* CRT scanlines + vignette overlay */\n  body::before{\n    content:\"\"; position:fixed; inset:0; z-index:2147483000; pointer-events:none;\n    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.16) 3px, rgba(0,0,0,0) 4px);\n    mix-blend-mode:multiply; animation:crt-flicker 4s steps(60) infinite;\n  }\n  body::after{\n    content:\"\"; position:fixed; inset:0; z-index:2147482999; pointer-events:none;\n    background:radial-gradient(ellipse 120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);\n  }\n<\u002Fstyle>\n<script src=\"3f23133d-d527-472b-87a1-79ec99913141\"><\u002Fscript>\n<script src=\"b7128ccf-7ddc-4853-83ad-793b9d27d8ed\"><\u002Fscript>\n<script src=\"0610dcaa-6fee-44e4-9c7c-184d352e387c\"><\u002Fscript>\n<script src=\"c5835ce3-dac0-4eb5-a98a-46cf2188770b\"><\u002Fscript>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"50fa8297-cce7-4916-bb00-3cda630eff3c#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n  <section data-label=\"Portada\" data-screen-label=\"Portada\" data-speaker-notes=\"Benvinguda. Avui passem de la idea d'algorisme fins a la lògica binària que hi ha sota tot programa. 60 minuts, amb exercicis pel mig.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;justify-content:space-between;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;\">CICLE FORMATIU · PROGRAMACIÓ<\u002Fdiv>\n    <div>\n      <h1 style=\"font-family:'Press Start 2P',cursive;font-size:56px;font-weight:400;line-height:1.22;margin:0;\">Fonaments de la<br>programació<\u002Fh1>\n      <p style=\"font-size:40px;color:#9a93c9;margin:34px 0 0;font-weight:400;\">De l'algorisme a la lògica binària<\u002Fp>\n      <p style=\"font-family:'Press Start 2P',cursive;font-size:15px;color:#ffd23f;margin:30px 0 0;letter-spacing:.04em;\">Professora: Clàudia Reina<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;font-family:'VT323',monospace;font-size:22px;color:#6f67a0;flex-wrap:wrap;\">\n      <span style=\"padding:8px 18px;border:1px solid #3a2f73;border-radius:0;\">variables<\u002Fspan>\n      <span style=\"padding:8px 18px;border:1px solid #3a2f73;border-radius:0;\">operadors<\u002Fspan>\n      <span style=\"padding:8px 18px;border:1px solid #3a2f73;border-radius:0;\">condicions<\u002Fspan>\n      <span style=\"padding:8px 18px;border:1px solid #3a2f73;border-radius:0;\">portes lògiques<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Algorisme\" data-screen-label=\"Què és un algorisme\" data-speaker-notes=\"Un algorisme és una recepta: passos finits, ordenats i sense ambigüitat per resoldre un problema. Programar és escriure aquesta recepta perquè una màquina l'executi.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">PUNT DE PARTIDA<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 50px;line-height:1.05;\">Què és un algorisme?<\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;\">\n      <div style=\"flex:1.1;display:flex;flex-direction:column;justify-content:center;\">\n        <p style=\"font-size:36px;line-height:1.5;color:#d7d2ff;margin:0;\">Una <strong style=\"color:#5ef58c;font-weight:600;\">seqüència finita de passos<\u002Fstrong>, ordenats i sense ambigüitat, que resol un problema.<\u002Fp>\n        <p style=\"font-size:32px;line-height:1.5;color:#9a93c9;margin:30px 0 0;\">Programar és escriure aquesta recepta amb un llenguatge que la màquina pugui executar.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:44px;display:flex;flex-direction:column;gap:22px;justify-content:center;\">\n        <div style=\"font-family:'VT323',monospace;font-size:22px;color:#6f67a0;letter-spacing:.1em;\">ALGORISME · FER UN CAFÈ<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px;font-family:'VT323',monospace;font-size:30px;\">\n          <div><span style=\"color:#5ef58c;\">1.<\u002Fspan> omplir el dipòsit d'aigua<\u002Fdiv>\n          <div><span style=\"color:#5ef58c;\">2.<\u002Fspan> posar la càpsula<\u002Fdiv>\n          <div><span style=\"color:#5ef58c;\">3.<\u002Fspan> <span style=\"color:#ffd23f;\">si<\u002Fspan> hi ha tassa → prémer botó<\u002Fdiv>\n          <div><span style=\"color:#5ef58c;\">4.<\u002Fspan> esperar fins que s'ompli<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"L'ordre importa\" data-screen-label=\"L'ordre dels passos importa\" data-speaker-notes=\"Slide interactiva. Els mateixos passos en ordre diferent donen un resultat diferent — o cap resultat. Demana a un alumne que ordeni els passos del caixer amb les fletxes; fins que no estiguin tots ben col·locats el banner queda en vermell. La idea clau: un algorisme no és només QUÈ fas, sinó EN QUIN ORDRE. No pots agafar els diners abans de marcar el PIN.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:80px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:16px;\"><span style=\"font-family:'Press Start 2P',cursive;font-size:12px;color:#05140d;background:#5ef58c;padding:6px 16px;border-radius:0;letter-spacing:.1em;\">INTERACTIU<\u002Fspan><span style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;\">PUNT DE PARTIDA<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:56px;font-weight:600;margin:0 0 8px;line-height:1.05;\">L'ordre dels passos importa<\u002Fh2>\n    <p style=\"font-size:26px;color:#9a93c9;margin:0 0 30px;max-width:80%;\">Els mateixos passos, en un ordre diferent, donen un altre resultat — o no en donen cap.<\u002Fp>\n    <div style=\"display:flex;gap:54px;flex:1;align-items:center;\">\n      <div style=\"flex:0 0 360px;\">\n        <p style=\"font-size:30px;line-height:1.5;color:#d7d2ff;margin:0 0 24px;\">Ordena els passos per <strong style=\"color:#5ef58c;font-weight:600;\">treure diners del caixer<\u002Fstrong>.<\u002Fp>\n        <p style=\"font-size:27px;line-height:1.5;color:#9a93c9;margin:0;\">No pots <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">agafar els diners<\u002Fspan> abans de <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">marcar el PIN<\u002Fspan>. Cada pas depèn de l'anterior.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;max-width:760px;\">\n        <algo-order><\u002Falgo-order>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Agenda\" data-screen-label=\"Agenda\" data-speaker-notes=\"Cinc blocs. Cada un construeix sobre l'anterior: les variables guarden dades, els operadors les combinen, les condicions decideixen, i la lògica i les portes són el mateix concepte a nivell de programari i de màquina.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">EL CAMÍ D'AVUI<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 56px;line-height:1.05;\">Cinc blocs, una sola idea<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px 56px;flex:1;align-content:center;\">\n      <div style=\"display:flex;gap:26px;align-items:baseline;\"><span style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">01<\u002Fspan><div><div style=\"font-size:34px;font-weight:600;\">Variables<\u002Fdiv><div style=\"font-size:26px;color:#9a93c9;margin-top:4px;\">guardar dades amb un nom<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:baseline;\"><span style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">02<\u002Fspan><div><div style=\"font-size:34px;font-weight:600;\">Operadors matemàtics<\u002Fdiv><div style=\"font-size:26px;color:#9a93c9;margin-top:4px;\">calcular i combinar valors<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:baseline;\"><span style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">03<\u002Fspan><div><div style=\"font-size:34px;font-weight:600;\">Condicions<\u002Fdiv><div style=\"font-size:26px;color:#9a93c9;margin-top:4px;\">prendre decisions<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:baseline;\"><span style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">04<\u002Fspan><div><div style=\"font-size:34px;font-weight:600;\">Operadors lògics<\u002Fdiv><div style=\"font-size:26px;color:#9a93c9;margin-top:4px;\">AND, OR, NOT<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:baseline;\"><span style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">05<\u002Fspan><div><div style=\"font-size:34px;font-weight:600;\">Portes lògiques<\u002Fdiv><div style=\"font-size:26px;color:#9a93c9;margin-top:4px;\">la lògica dins el maquinari<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"01 · Variables\" data-screen-label=\"Secció 01 Variables\" data-speaker-notes=\"Primera secció. Les variables són la base: sense un lloc on guardar dades, no hi ha res a calcular ni a decidir.\" style=\"height:100%;box-sizing:border-box;background:#1a0b2e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;justify-content:center;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:118px;font-weight:400;color:#5ef58c;line-height:1;letter-spacing:-0.02em;\">01<\u002Fdiv>\n    <h2 style=\"font-family:'Press Start 2P',cursive;font-size:40px;font-weight:400;margin:20px 0 0;line-height:1.25;\">Variables<\u002Fh2>\n    <p style=\"font-size:36px;color:#9a93c9;margin:24px 0 0;max-width:60%;\">Caixes amb nom on el programa guarda i recupera dades.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Caixes amb nom\" data-screen-label=\"Variables caixes amb nom\" data-speaker-notes=\"Metàfora de la caixa: un nom a fora, un valor a dins. El valor pot canviar (per això es diu variable), però el nom es manté. Tres ingredients: nom, tipus, valor.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">01 · VARIABLES<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 46px;line-height:1.05;\">Una variable és una caixa amb nom<\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;align-items:center;\">\n      <div style=\"flex:1;\">\n        <div style=\"display:flex;flex-direction:column;gap:24px;\">\n          <div style=\"display:flex;align-items:center;gap:24px;\"><div style=\"font-family:'VT323',monospace;font-size:28px;color:#5ef58c;width:120px;\">nom<\u002Fdiv><div style=\"font-size:30px;color:#d7d2ff;\">com identifiquem la caixa: <span style=\"font-family:'VT323',monospace;color:#fff;\">edat<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:24px;\"><div style=\"font-family:'VT323',monospace;font-size:28px;color:#5ef58c;width:120px;\">tipus<\u002Fdiv><div style=\"font-size:30px;color:#d7d2ff;\">quina mena de dada hi cap: <span style=\"font-family:'VT323',monospace;color:#fff;\">enter<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:24px;\"><div style=\"font-family:'VT323',monospace;font-size:28px;color:#5ef58c;width:120px;\">valor<\u002Fdiv><div style=\"font-size:30px;color:#d7d2ff;\">què hi ha dins ara mateix: <span style=\"font-family:'VT323',monospace;color:#fff;\">19<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:28px;color:#9a93c9;margin:40px 0 0;line-height:1.5;\">El valor pot canviar durant el programa — per això és «variable» — però el nom es manté.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 440px;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:40px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;margin-bottom:24px;letter-spacing:.08em;\">A LA MEMÒRIA<\u002Fdiv>\n        <div style=\"border:2px solid #5ef58c;border-radius:0;padding:30px;position:relative;\">\n          <div style=\"position:absolute;top:-18px;left:24px;background:#1c1640;padding:0 12px;font-family:'VT323',monospace;font-size:24px;color:#5ef58c;\">edat<\u002Fdiv>\n          <div style=\"font-family:'VT323',monospace;font-size:72px;font-weight:700;text-align:center;color:#fff;\">19<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;text-align:center;margin-top:18px;\">tipus: enter<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Constants\" data-screen-label=\"Constants\" data-speaker-notes=\"Una constant és com una variable, però el seu valor es fixa una vegada i ja no es pot tornar a assignar. Si el programa ho intenta, dóna error. Per conveni s'escriuen en MAJÚSCULES. Serveixen per a valors que no han de canviar mai (PI, l'IVA, un límit) i eviten els 'números màgics' escampats pel codi: si el valor canvia, només el toques en un lloc.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">01 · VARIABLES<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 14px;line-height:1.05;\">Constants: valors que no canvien<\u002Fh2>\n    <p style=\"font-size:28px;color:#9a93c9;margin:0 0 36px;max-width:82%;\">Com una variable, però el valor es fixa <strong style=\"color:#d7d2ff;\">una sola vegada<\u002Fstrong>. Després ja no es pot reassignar.<\u002Fp>\n    <div style=\"display:flex;gap:44px;flex:1;align-items:center;\">\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:22px;\">\n        <div style=\"display:flex;gap:22px;align-items:baseline;\"><div style=\"font-family:'VT323',monospace;font-size:26px;color:#5ef58c;flex:0 0 150px;\">conveni<\u002Fdiv><div style=\"font-size:29px;color:#d7d2ff;\">s'escriuen en <span style=\"font-family:'VT323',monospace;color:#fff;\">MAJÚSCULES<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:22px;align-items:baseline;\"><div style=\"font-family:'VT323',monospace;font-size:26px;color:#5ef58c;flex:0 0 150px;\">seguretat<\u002Fdiv><div style=\"font-size:29px;color:#d7d2ff;\">reassignar-la dóna <span style=\"color:#ffd23f;\">error<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:22px;align-items:baseline;\"><div style=\"font-family:'VT323',monospace;font-size:26px;color:#5ef58c;flex:0 0 150px;\">claredat<\u002Fdiv><div style=\"font-size:29px;color:#d7d2ff;\">un sol lloc on canviar el valor<\u002Fdiv><\u002Fdiv>\n        <p style=\"font-size:26px;color:#9a93c9;line-height:1.5;margin:14px 0 0;border-top:1px solid #3a2f73;padding-top:22px;\">Eviten els «números màgics»: en comptes de repetir <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">0.21<\u002Fspan> pertot, escrius <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">IVA<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 540px;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:38px;font-family:'VT323',monospace;font-size:27px;line-height:1.8;\">\n        <div style=\"color:#6f67a0;font-size:22px;\">// pseudocodi<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">constant<\u002Fspan> PI <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">3.1416<\u002Fspan><\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">constant<\u002Fspan> IVA <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">0.21<\u002Fspan><\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">constant<\u002Fspan> MAX_INTENTS <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">3<\u002Fspan><\u002Fdiv>\n        <div style=\"height:16px;\"><\u002Fdiv>\n        <div style=\"color:#6f67a0;font-size:22px;\">// més tard al programa...<\u002Fdiv>\n        <div style=\"color:#9a93c9;\">PI <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">3<\u002Fspan> &nbsp;<span style=\"color:#ff5fa2;\">✕ error<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Globals i locals\" data-screen-label=\"Variables globals i locals\" data-speaker-notes=\"L'àmbit (scope) d'una variable és on es pot fer servir. Una variable local neix dins d'una funció o bloc i només existeix allí; quan el bloc acaba, desapareix. Una global es declara fora i és accessible des de tot el programa. Consell: fes servir locals per defecte; les globals compartides per tot arreu fan el codi difícil de seguir i depurar.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">01 · VARIABLES<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 14px;line-height:1.05;\">Variables globals i locals<\u002Fh2>\n    <p style=\"font-size:28px;color:#9a93c9;margin:0 0 36px;max-width:82%;\">L'àmbit d'una variable és <strong style=\"color:#d7d2ff;\">on es pot fer servir<\u002Fstrong>. Això depèn d'on la declares.<\u002Fp>\n    <div style=\"display:flex;gap:40px;flex:1;\">\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:36px;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;font-weight:700;\">global<\u002Fdiv>\n        <div style=\"font-size:28px;color:#d7d2ff;line-height:1.45;\">Declarada <strong style=\"color:#fff;\">fora<\u002Fstrong> de tot bloc. Accessible des de qualsevol punt del programa.<\u002Fdiv>\n        <div style=\"font-size:25px;color:#9a93c9;line-height:1.45;margin-top:auto;\">Viu mentre el programa s'executa.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:36px;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;font-weight:700;\">local<\u002Fdiv>\n        <div style=\"font-size:28px;color:#d7d2ff;line-height:1.45;\">Declarada <strong style=\"color:#fff;\">dins<\u002Fstrong> d'una funció o bloc. Només existeix allí.<\u002Fdiv>\n        <div style=\"font-size:25px;color:#9a93c9;line-height:1.45;margin-top:auto;\">Neix i mor amb el bloc.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1.15;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;font-family:'VT323',monospace;font-size:26px;line-height:1.7;\">\n        <div style=\"color:#6f67a0;font-size:22px;\">// pseudocodi<\u002Fdiv>\n        <div>iva <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">0.21<\u002Fspan> &nbsp;<span style=\"color:#6f67a0;\">// global<\u002Fspan><\u002Fdiv>\n        <div style=\"height:12px;\"><\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">funció<\u002Fspan> total(preu)<\u002Fdiv>\n        <div style=\"padding-left:32px;\">base <span style=\"color:#5ef58c;\">←<\u002Fspan> preu <span style=\"color:#6f67a0;\">// local<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:32px;\"><span style=\"color:#5ef58c;\">retorna<\u002Fspan> base × (1 + iva)<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">fi funció<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:26px;color:#9a93c9;margin:26px 0 0;\">Consell: per defecte fes servir <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">locals<\u002Fspan>. Abusar de globals fa el codi difícil de seguir i depurar.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Tipus de dades\" data-screen-label=\"Tipus de dades\" data-speaker-notes=\"Quatre tipus bàsics que cobreixen quasi tot al principi. El tipus determina quines operacions tenen sentit: pots sumar enters, però no sumar un text amb un booleà.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">01 · VARIABLES<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 46px;line-height:1.05;\">Tipus de dades bàsics<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:30px;flex:1;align-content:center;\">\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:36px;display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">enter<\u002Fdiv>\n        <div style=\"font-size:28px;color:#9a93c9;\">nombres sencers, sense decimals<\u002Fdiv>\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#ffd23f;margin-top:auto;\">-7   0   42<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:36px;display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">real<\u002Fdiv>\n        <div style=\"font-size:28px;color:#9a93c9;\">nombres amb decimals<\u002Fdiv>\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#ffd23f;margin-top:auto;\">3.14   -0.5<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:36px;display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">text<\u002Fdiv>\n        <div style=\"font-size:28px;color:#9a93c9;\">seqüència de caràcters<\u002Fdiv>\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#ffd23f;margin-top:auto;\">\"Hola\"   \"B2\"<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:36px;display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#5ef58c;\">booleà<\u002Fdiv>\n        <div style=\"font-size:28px;color:#9a93c9;\">només dos valors possibles<\u002Fdiv>\n        <div style=\"font-family:'VT323',monospace;font-size:30px;color:#ffd23f;margin-top:auto;\">cert   fals<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Coherència dada–tipus\" data-screen-label=\"Coherència dada tipus interactiu\" data-speaker-notes=\"Slide interactiva. El valor que guardes ha de ser coherent amb el tipus de la variable. Tria un tipus a dalt i mira quins valors s'hi il·luminen en verd (caben) i quins en vermell (no caben). Clica un valor per veure el perquè. Punt fi: un enter cap dins d'un real, però un real (3.14) no cap dins d'un enter, i un text mai és un nombre. Aquesta comprovació és el que molts llenguatges fan per tu.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:80px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:16px;\"><span style=\"font-family:'Press Start 2P',cursive;font-size:12px;color:#05140d;background:#5ef58c;padding:6px 16px;border-radius:0;letter-spacing:.1em;\">INTERACTIU<\u002Fspan><span style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;\">01 · VARIABLES<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:56px;font-weight:600;margin:0 0 10px;line-height:1.05;\">La dada ha de quadrar amb el tipus<\u002Fh2>\n    <p style=\"font-size:26px;color:#9a93c9;margin:0 0 30px;max-width:82%;\">El valor que guardes a una variable ha de ser <strong style=\"color:#d7d2ff;\">coherent<\u002Fstrong> amb el seu tipus. Tria un tipus i mira què hi cap.<\u002Fp>\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"width:100%;max-width:1100px;\">\n        <type-check><\u002Ftype-check>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Assignació\" data-screen-label=\"Assignació pas a pas\" data-speaker-notes=\"La fletxa ← vol dir assignar: agafa el valor de la dreta i posa'l a la caixa de l'esquerra. No és igualtat matemàtica. Llegim la traça línia a línia i veiem com canvia la memòria.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">01 · VARIABLES<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 40px;line-height:1.05;\">Assignació: <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">←<\u002Fspan> posa un valor a la caixa<\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;\">\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:40px;font-family:'VT323',monospace;font-size:32px;line-height:1.9;\">\n        <div><span style=\"color:#6f67a0;\">// pseudocodi<\u002Fspan><\u002Fdiv>\n        <div>x <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">5<\u002Fspan><\u002Fdiv>\n        <div>y <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">3<\u002Fspan><\u002Fdiv>\n        <div>x <span style=\"color:#5ef58c;\">←<\u002Fspan> x + y<\u002Fdiv>\n        <div>y <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">0<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;\">\n        <div style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;letter-spacing:.08em;\">TRAÇA · VALOR FINAL<\u002Fdiv>\n        <div style=\"display:flex;gap:22px;\">\n          <div style=\"flex:1;border:2px solid #5ef58c;border-radius:0;padding:26px;position:relative;text-align:center;\">\n            <div style=\"position:absolute;top:-16px;left:20px;background:#0e0b1e;padding:0 10px;font-family:'VT323',monospace;font-size:22px;color:#5ef58c;\">x<\u002Fdiv>\n            <div style=\"font-family:'VT323',monospace;font-size:64px;font-weight:700;\">8<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;border:2px solid #3a2f73;border-radius:0;padding:26px;position:relative;text-align:center;\">\n            <div style=\"position:absolute;top:-16px;left:20px;background:#0e0b1e;padding:0 10px;font-family:'VT323',monospace;font-size:22px;color:#9a93c9;\">y<\u002Fdiv>\n            <div style=\"font-family:'VT323',monospace;font-size:64px;font-weight:700;color:#9a93c9;\">0<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:27px;color:#9a93c9;line-height:1.5;margin:14px 0 0;\"><span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">x ← x + y<\u002Fspan> llegeix el valor vell de x (5), hi suma y (3) i torna a desar 8 a x.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Exercici · traça\" data-screen-label=\"Exercici traça\" data-speaker-notes=\"Deixa que ho intentin 1-2 minuts en parella. Solució: a=10, b=4 → a=14; després b=a-b=14-4=10; després a=a-b=14-10=4. És l'intercanvi clàssic sense variable auxiliar. Resultat: a=4, b=10.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:18px;\"><span style=\"font-family:'Press Start 2P',cursive;font-size:12px;color:#05140d;background:#5ef58c;padding:6px 16px;border-radius:0;letter-spacing:.1em;\">EXERCICI<\u002Fspan><span style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;\">01 · VARIABLES<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 44px;line-height:1.05;\">Quin valor tenen a i b al final?<\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;align-items:center;\">\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:44px;font-family:'VT323',monospace;font-size:34px;line-height:1.95;\">\n        <div>a <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">10<\u002Fspan><\u002Fdiv>\n        <div>b <span style=\"color:#5ef58c;\">←<\u002Fspan> <span style=\"color:#ffd23f;\">4<\u002Fspan><\u002Fdiv>\n        <div>a <span style=\"color:#5ef58c;\">←<\u002Fspan> a + b<\u002Fdiv>\n        <div>b <span style=\"color:#5ef58c;\">←<\u002Fspan> a - b<\u002Fdiv>\n        <div>a <span style=\"color:#5ef58c;\">←<\u002Fspan> a - b<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 360px;display:flex;flex-direction:column;gap:24px;\">\n        <p style=\"font-size:30px;color:#9a93c9;line-height:1.5;margin:0;\">Segueix la traça línia a línia. Pista: cap variable auxiliar... què passa amb a i b?<\u002Fp>\n        <div style=\"font-family:'VT323',monospace;font-size:26px;color:#6f67a0;border-top:1px solid #3a2f73;padding-top:22px;\">resposta a la següent secció ↓<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"02 · Operadors\" data-screen-label=\"Secció 02 Operadors matemàtics\" data-speaker-notes=\"Segona secció. Ja tenim dades a les variables; ara les combinem. Solució de l'exercici anterior: a=4, b=10 (intercanvi sense auxiliar).\" style=\"height:100%;box-sizing:border-box;background:#1a0b2e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;justify-content:center;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:118px;font-weight:400;color:#5ef58c;line-height:1;letter-spacing:-0.02em;\">02<\u002Fdiv>\n    <h2 style=\"font-family:'Press Start 2P',cursive;font-size:40px;font-weight:400;margin:20px 0 0;line-height:1.25;\">Operadors matemàtics<\u002Fh2>\n    <p style=\"font-size:36px;color:#9a93c9;margin:24px 0 0;max-width:60%;\">Símbols que calculen un valor nou a partir d'altres.<\u002Fp>\n    <div style=\"margin-top:34px;font-family:'VT323',monospace;font-size:26px;color:#6f67a0;\">solució exercici anterior → a = 4 · b = 10 (intercanvi sense variable auxiliar)<\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Operadors mat.\" data-screen-label=\"Operadors matemàtics taula\" data-speaker-notes=\"Cinc operadors clau. Insisteix en divisió entera (quocient) i mòdul (residu): són els que costen més. 17 mod 5 = 2 perquè 17 = 3·5 + 2.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">02 · OPERADORS MATEMÀTICS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 40px;line-height:1.05;\">Cinc operadors per calcular<\u002Fh2>\n    <table style=\"width:100%;border-collapse:collapse;font-family:'VT323',monospace;flex:1;\">\n      <thead><tr style=\"color:#5ef58c;font-size:26px;text-align:left;\">\n        <th style=\"padding:18px 20px;border-bottom:1px solid #3a2f73;font-weight:500;width:120px;\">símbol<\u002Fth>\n        <th style=\"padding:18px 20px;border-bottom:1px solid #3a2f73;font-weight:500;\">operació<\u002Fth>\n        <th style=\"padding:18px 20px;border-bottom:1px solid #3a2f73;font-weight:500;\">exemple<\u002Fth>\n        <th style=\"padding:18px 20px;border-bottom:1px solid #3a2f73;font-weight:500;\">resultat<\u002Fth>\n      <\u002Ftr><\u002Fthead>\n      <tbody style=\"font-size:32px;\">\n        <tr><td style=\"padding:20px;color:#fff;font-size:38px;\">+<\u002Ftd><td style=\"padding:20px;color:#d7d2ff;font-family:'VT323',monospace;\">suma<\u002Ftd><td style=\"padding:20px;color:#9a93c9;\">7 + 3<\u002Ftd><td style=\"padding:20px;color:#ffd23f;\">10<\u002Ftd><\u002Ftr>\n        <tr><td style=\"padding:20px;color:#fff;font-size:38px;\">−<\u002Ftd><td style=\"padding:20px;color:#d7d2ff;font-family:'VT323',monospace;\">resta<\u002Ftd><td style=\"padding:20px;color:#9a93c9;\">7 − 3<\u002Ftd><td style=\"padding:20px;color:#ffd23f;\">4<\u002Ftd><\u002Ftr>\n        <tr><td style=\"padding:20px;color:#fff;font-size:38px;\">×<\u002Ftd><td style=\"padding:20px;color:#d7d2ff;font-family:'VT323',monospace;\">multiplicació<\u002Ftd><td style=\"padding:20px;color:#9a93c9;\">7 × 3<\u002Ftd><td style=\"padding:20px;color:#ffd23f;\">21<\u002Ftd><\u002Ftr>\n        <tr><td style=\"padding:20px;color:#fff;font-size:34px;\">div<\u002Ftd><td style=\"padding:20px;color:#d7d2ff;font-family:'VT323',monospace;\">divisió entera (quocient)<\u002Ftd><td style=\"padding:20px;color:#9a93c9;\">17 div 5<\u002Ftd><td style=\"padding:20px;color:#ffd23f;\">3<\u002Ftd><\u002Ftr>\n        <tr><td style=\"padding:20px;color:#fff;font-size:34px;\">mod<\u002Ftd><td style=\"padding:20px;color:#d7d2ff;font-family:'VT323',monospace;\">mòdul (residu)<\u002Ftd><td style=\"padding:20px;color:#9a93c9;\">17 mod 5<\u002Ftd><td style=\"padding:20px;color:#ffd23f;\">2<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n    <p style=\"font-size:27px;color:#9a93c9;margin:26px 0 0;\"><span style=\"font-family:'VT323',monospace;color:#5ef58c;\">mod<\u002Fspan> és claríssim per saber si un nombre és parell: <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">n mod 2 = 0<\u002Fspan>.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mòdul · parells\" data-screen-label=\"Mòdul parells senars cicles\" data-speaker-notes=\"El mòdul (residu) sembla petit però és dels operadors més útils. n mod 2 distingeix parells (residu 0) de senars (residu 1). Generalitzant: n mod k val 0 just quan n és múltiple de k, i això serveix per a tot allò que es repeteix en cicle: cada 3, repartir en grups, torns rotatius, files alternades. Fes-los notar el patró de la columna del residu: sempre va 0,1,0,1... o 0,1,2,0,1,2...\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">02 · OPERADORS MATEMÀTICS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 12px;line-height:1.05;\">El mòdul detecta parells, senars i cicles<\u002Fh2>\n    <p style=\"font-size:27px;color:#9a93c9;margin:0 0 34px;max-width:84%;\"><span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">n mod k<\u002Fspan> és <span style=\"color:#5ef58c;\">0<\u002Fspan> just quan <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">n<\u002Fspan> és múltiple de <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">k<\u002Fspan>. Aquí hi ha tots els patrons repetitius.<\u002Fp>\n    <div style=\"display:flex;gap:44px;flex:1;align-items:stretch;\">\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;display:flex;flex-direction:column;\">\n        <div style=\"font-family:'VT323',monospace;font-size:26px;color:#5ef58c;margin-bottom:20px;\">parell o senar · n mod 2<\u002Fdiv>\n        <table style=\"border-collapse:collapse;font-family:'VT323',monospace;font-size:26px;width:100%;\">\n          <thead><tr style=\"color:#9a93c9;font-size:22px;text-align:left;\"><th style=\"padding:8px 14px;font-weight:500;\">n<\u002Fth><th style=\"padding:8px 14px;font-weight:500;\">n mod 2<\u002Fth><th style=\"padding:8px 14px;font-weight:500;\">què és<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"padding:8px 14px;color:#d7d2ff;\">4<\u002Ftd><td style=\"padding:8px 14px;color:#5ef58c;\">0<\u002Ftd><td style=\"padding:8px 14px;color:#9a93c9;font-family:'VT323',monospace;\">parell<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 14px;color:#d7d2ff;\">7<\u002Ftd><td style=\"padding:8px 14px;color:#ffd23f;\">1<\u002Ftd><td style=\"padding:8px 14px;color:#9a93c9;font-family:'VT323',monospace;\">senar<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 14px;color:#d7d2ff;\">10<\u002Ftd><td style=\"padding:8px 14px;color:#5ef58c;\">0<\u002Ftd><td style=\"padding:8px 14px;color:#9a93c9;font-family:'VT323',monospace;\">parell<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 14px;color:#d7d2ff;\">15<\u002Ftd><td style=\"padding:8px 14px;color:#ffd23f;\">1<\u002Ftd><td style=\"padding:8px 14px;color:#9a93c9;font-family:'VT323',monospace;\">senar<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n        <div style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;margin-top:auto;padding-top:20px;\">residu = 0,1,0,1,0,1 …<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:34px;display:flex;flex-direction:column;gap:18px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:26px;color:#5ef58c;margin-bottom:4px;\">repartir en cicle · i mod 3<\u002Fdiv>\n        <div style=\"font-size:27px;color:#d7d2ff;line-height:1.45;\">Recórrer una llista i posar cada element en una de 3 columnes:<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;font-family:'VT323',monospace;font-size:24px;\">\n          <span style=\"padding:8px 14px;border-radius:0;background:rgba(94,245,140,.12);color:#5ef58c;\">i=0→0<\u002Fspan>\n          <span style=\"padding:8px 14px;border-radius:0;background:#0e0b1e;border:1px solid #3a2f73;color:#d7d2ff;\">i=1→1<\u002Fspan>\n          <span style=\"padding:8px 14px;border-radius:0;background:#0e0b1e;border:1px solid #3a2f73;color:#d7d2ff;\">i=2→2<\u002Fspan>\n          <span style=\"padding:8px 14px;border-radius:0;background:rgba(94,245,140,.12);color:#5ef58c;\">i=3→0<\u002Fspan>\n          <span style=\"padding:8px 14px;border-radius:0;background:#0e0b1e;border:1px solid #3a2f73;color:#d7d2ff;\">i=4→1<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:26px;color:#9a93c9;line-height:1.5;margin-top:6px;\">El residu mai passa de <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">k−1<\u002Fspan>: torna a 0 i recomença. Per això serveix per a torns, files alternades o «cada N».<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mòdul · temps\" data-screen-label=\"Mòdul temps interactiu\" data-speaker-notes=\"Slide interactiva. Aquí es veu per què el mòdul és essencial amb el temps. Canvia els segons totals amb els botons i mira com es descomponen en hores, minuts i segons fent servir div i mod. Punts clau: 'mod 60' dóna sempre els segons (0-59), 'div 60' passa a minuts, 'div 3600' a hores. I 'h mod 24' és el que fa que el rellotge torni a 0 després de les 23: és aritmètica cíclica. Fes que un alumne predigui el rellotge en afegir 1 hora a les 23:xx.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:78px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:14px;\"><span style=\"font-family:'Press Start 2P',cursive;font-size:12px;color:#05140d;background:#5ef58c;padding:6px 16px;border-radius:0;letter-spacing:.1em;\">INTERACTIU<\u002Fspan><span style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;\">02 · OPERADORS MATEMÀTICS<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:54px;font-weight:600;margin:0 0 8px;line-height:1.05;\">El mòdul reparteix el temps<\u002Fh2>\n    <p style=\"font-size:26px;color:#9a93c9;margin:0 0 28px;max-width:84%;\">Amb <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">div<\u002Fspan> i <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">mod<\u002Fspan>, uns segons totals es tornen hores, minuts i segons. I <span style=\"font-family:'VT323',monospace;color:#d7d2ff;\">mod 24<\u002Fspan> fa que el rellotge torni a començar.<\u002Fp>\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"width:100%;max-width:980px;\">\n        <mod-time><\u002Fmod-time>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Precedència\" data-screen-label=\"Precedència operadors\" data-speaker-notes=\"Com a matemàtiques: primer parèntesis, després multiplicació/divisió/mòdul, després suma/resta. A igualtat, d'esquerra a dreta. Els parèntesis sempre manen i fan el codi més llegible.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">02 · OPERADORS MATEMÀTICS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 44px;line-height:1.05;\">Precedència: qui es calcula abans<\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;align-items:center;\">\n      <div style=\"flex:0 0 480px;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"display:flex;align-items:center;gap:20px;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:22px 28px;\"><span style=\"font-family:'VT323',monospace;font-size:26px;color:#5ef58c;\">1r<\u002Fspan><span style=\"font-size:30px;\">( ) parèntesis<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:20px;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:22px 28px;\"><span style=\"font-family:'VT323',monospace;font-size:26px;color:#5ef58c;\">2n<\u002Fspan><span style=\"font-size:30px;\">× &nbsp; div &nbsp; mod<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:20px;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:22px 28px;\"><span style=\"font-family:'VT323',monospace;font-size:26px;color:#5ef58c;\">3r<\u002Fspan><span style=\"font-size:30px;\">+ &nbsp; −<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:26px;color:#9a93c9;margin-top:8px;\">A igualtat de nivell, d'esquerra a dreta.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:44px;font-family:'VT323',monospace;font-size:34px;line-height:2;\">\n        <div style=\"color:#6f67a0;font-size:26px;\">// avaluem pas a pas<\u002Fdiv>\n        <div style=\"margin-top:14px;\">2 + 3 <span style=\"color:#5ef58c;\">×<\u002Fspan> 4<\u002Fdiv>\n        <div style=\"color:#9a93c9;\">2 + <span style=\"color:#ffd23f;\">12<\u002Fspan><\u002Fdiv>\n        <div style=\"color:#fff;\">= <span style=\"color:#ffd23f;\">14<\u002Fspan><\u002Fdiv>\n        <div style=\"height:24px;\"><\u002Fdiv>\n        <div>(2 + 3) <span style=\"color:#5ef58c;\">×<\u002Fspan> 4<\u002Fdiv>\n        <div style=\"color:#9a93c9;\"><span style=\"color:#ffd23f;\">5<\u002Fspan> × 4<\u002Fdiv>\n        <div style=\"color:#fff;\">= <span style=\"color:#ffd23f;\">20<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Exercici · expressió\" data-screen-label=\"Exercici expressió\" data-speaker-notes=\"1 minut. Solució: mod abans que +/−. 20 mod 6 = 2. Llavors 10 - 2 + 3 = 11. L'error típic és fer 10-2=8 i 8+3... bé això dóna 11 igual; l'error real és calcular 6+3 primer. Resposta: 11.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:18px;\"><span style=\"font-family:'Press Start 2P',cursive;font-size:12px;color:#05140d;background:#5ef58c;padding:6px 16px;border-radius:0;letter-spacing:.1em;\">EXERCICI<\u002Fspan><span style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;\">02 · OPERADORS<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 56px;line-height:1.05;\">Avalua l'expressió respectant la precedència<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:40px;\">\n      <div style=\"font-family:'VT323',monospace;font-size:72px;font-weight:700;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:50px 80px;\">10 − 20 <span style=\"color:#5ef58c;\">mod<\u002Fspan> 6 + 3<\u002Fdiv>\n      <p style=\"font-size:30px;color:#9a93c9;max-width:60%;text-align:center;\">Quin és el resultat? Recorda l'ordre: primer <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">mod<\u002Fspan>, després les sumes i restes d'esquerra a dreta.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"03 · Condicions\" data-screen-label=\"Secció 03 Condicions\" data-speaker-notes=\"Tercera secció. Fins ara el programa anava recte; ara aprendrem a triar camins segons les dades. Solució anterior: 20 mod 6 = 2, després 10 − 2 + 3 = 11.\" style=\"height:100%;box-sizing:border-box;background:#1a0b2e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;justify-content:center;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:118px;font-weight:400;color:#5ef58c;line-height:1;letter-spacing:-0.02em;\">03<\u002Fdiv>\n    <h2 style=\"font-family:'Press Start 2P',cursive;font-size:40px;font-weight:400;margin:20px 0 0;line-height:1.25;\">Condicions<\u002Fh2>\n    <p style=\"font-size:36px;color:#9a93c9;margin:24px 0 0;max-width:60%;\">Executar un camí o un altre segons si una cosa és certa o falsa.<\u002Fp>\n    <div style=\"margin-top:34px;font-family:'VT323',monospace;font-size:26px;color:#6f67a0;\">solució exercici anterior → 20 mod 6 = 2 · 10 − 2 + 3 = 11<\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Prendre decisions\" data-screen-label=\"Condicions prendre decisions\" data-speaker-notes=\"Una condició és una pregunta de sí/no: una expressió booleana. Si és certa, s'executa el bloc de dins; si no, se salta. El diamant del diagrama de flux representa aquesta bifurcació.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">03 · CONDICIONS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 46px;line-height:1.05;\">El programa pregunta: cert o fals?<\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;align-items:center;\">\n      <div style=\"flex:1;\">\n        <p style=\"font-size:34px;line-height:1.5;color:#d7d2ff;margin:0 0 26px;\">Una <strong style=\"color:#5ef58c;font-weight:600;\">condició<\u002Fstrong> és una expressió que només pot valer <span style=\"font-family:'VT323',monospace;\">cert<\u002Fspan> o <span style=\"font-family:'VT323',monospace;\">fals<\u002Fspan>.<\u002Fp>\n        <p style=\"font-size:30px;line-height:1.5;color:#9a93c9;margin:0;\">Segons el resultat, el programa pren un camí o un altre. És el que permet que un programa «reaccioni».<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 520px;display:flex;flex-direction:column;align-items:center;gap:0;font-family:'VT323',monospace;\">\n        <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:18px 34px;font-size:28px;\">edat ≥ 18 ?<\u002Fdiv>\n        <div style=\"width:2px;height:30px;background:#3a2f73;\"><\u002Fdiv>\n        <div style=\"display:flex;gap:50px;\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;\"><div style=\"font-size:24px;color:#5ef58c;margin-bottom:10px;\">cert<\u002Fdiv><div style=\"background:rgba(94,245,140,.12);border:1px solid #5ef58c;border-radius:0;padding:18px 28px;font-size:26px;color:#5ef58c;\">«pots entrar»<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;\"><div style=\"font-size:24px;color:#6f67a0;margin-bottom:10px;\">fals<\u002Fdiv><div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:18px 28px;font-size:26px;color:#9a93c9;\">«has d'esperar»<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"if / else\" data-screen-label=\"if else if else\" data-speaker-notes=\"L'estructura completa: if comprova la primera condició; else if encadena alternatives; else captura tota la resta. Només s'executa la primera branca que es compleix. Aquest exemple classifica una nota.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">03 · CONDICIONS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 40px;line-height:1.05;\"><span style=\"font-family:'VT323',monospace;color:#5ef58c;\">si<\u002Fspan> / <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">si no si<\u002Fspan> / <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">si no<\u002Fspan><\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;\">\n      <div style=\"flex:1.2;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:40px;font-family:'VT323',monospace;font-size:29px;line-height:1.85;\">\n        <div><span style=\"color:#5ef58c;\">si<\u002Fspan> nota ≥ 9 <span style=\"color:#5ef58c;\">llavors<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:40px;color:#ffd23f;\">qualificació ← \"excel·lent\"<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">si no si<\u002Fspan> nota ≥ 7 <span style=\"color:#5ef58c;\">llavors<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:40px;color:#ffd23f;\">qualificació ← \"notable\"<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">si no si<\u002Fspan> nota ≥ 5 <span style=\"color:#5ef58c;\">llavors<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:40px;color:#ffd23f;\">qualificació ← \"aprovat\"<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">si no<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:40px;color:#ffd23f;\">qualificació ← \"suspès\"<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">fi si<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center;\">\n        <div style=\"font-size:30px;color:#d7d2ff;line-height:1.5;\"><span style=\"font-family:'VT323',monospace;color:#5ef58c;\">si<\u002Fspan> — la primera condició a comprovar.<\u002Fdiv>\n        <div style=\"font-size:30px;color:#d7d2ff;line-height:1.5;\"><span style=\"font-family:'VT323',monospace;color:#5ef58c;\">si no si<\u002Fspan> — alternatives encadenades.<\u002Fdiv>\n        <div style=\"font-size:30px;color:#d7d2ff;line-height:1.5;\"><span style=\"font-family:'VT323',monospace;color:#5ef58c;\">si no<\u002Fspan> — tot el que queda.<\u002Fdiv>\n        <div style=\"font-size:27px;color:#9a93c9;line-height:1.5;border-top:1px solid #3a2f73;padding-top:22px;\">Només s'executa <strong style=\"color:#fff;font-weight:600;\">la primera branca<\u002Fstrong> que es compleix; la resta es descarten.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Comparació\" data-screen-label=\"Operadors de comparació\" data-speaker-notes=\"Aquests operadors construeixen les condicions. Tots retornen un booleà. Atenció a la diferència entre = (comparar, pregunta) i ← (assignar, ordre): és l'error més comú quan comencen.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">03 · CONDICIONS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 40px;line-height:1.05;\">Operadors de comparació<\u002Fh2>\n    <div style=\"display:flex;gap:40px;flex:1;align-items:stretch;\">\n      <table style=\"flex:1;border-collapse:collapse;font-family:'VT323',monospace;align-self:center;\">\n        <tbody style=\"font-size:32px;\">\n          <tr><td style=\"padding:16px 24px;color:#5ef58c;font-size:38px;width:90px;\">=<\u002Ftd><td style=\"padding:16px 24px;color:#d7d2ff;font-family:'VT323',monospace;\">igual que<\u002Ftd><td style=\"padding:16px 24px;color:#9a93c9;\">5 = 5 → cert<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:16px 24px;color:#5ef58c;font-size:38px;\">≠<\u002Ftd><td style=\"padding:16px 24px;color:#d7d2ff;font-family:'VT323',monospace;\">diferent de<\u002Ftd><td style=\"padding:16px 24px;color:#9a93c9;\">5 ≠ 3 → cert<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:16px 24px;color:#5ef58c;font-size:38px;\">&gt;<\u002Ftd><td style=\"padding:16px 24px;color:#d7d2ff;font-family:'VT323',monospace;\">més gran que<\u002Ftd><td style=\"padding:16px 24px;color:#9a93c9;\">5 &gt; 8 → fals<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:16px 24px;color:#5ef58c;font-size:38px;\">&lt;<\u002Ftd><td style=\"padding:16px 24px;color:#d7d2ff;font-family:'VT323',monospace;\">més petit que<\u002Ftd><td style=\"padding:16px 24px;color:#9a93c9;\">5 &lt; 8 → cert<\u002Ftd><\u002Ftr>\n          <tr><td style=\"padding:16px 24px;color:#5ef58c;font-size:34px;\">≥ ≤<\u002Ftd><td style=\"padding:16px 24px;color:#d7d2ff;font-family:'VT323',monospace;\">major/menor o igual<\u002Ftd><td style=\"padding:16px 24px;color:#9a93c9;\">5 ≥ 5 → cert<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <div style=\"flex:0 0 400px;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:36px;display:flex;flex-direction:column;justify-content:center;gap:18px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;letter-spacing:.08em;\">NO CONFONGUIS<\u002Fdiv>\n        <div style=\"font-size:30px;\"><span style=\"font-family:'VT323',monospace;color:#5ef58c;\">=<\u002Fspan> &nbsp;<span style=\"color:#9a93c9;\">compara<\u002Fspan> (és una pregunta)<\u002Fdiv>\n        <div style=\"font-size:30px;\"><span style=\"font-family:'VT323',monospace;color:#ffd23f;\">←<\u002Fspan> &nbsp;<span style=\"color:#9a93c9;\">assigna<\u002Fspan> (és una ordre)<\u002Fdiv>\n        <div style=\"font-size:26px;color:#d7d2ff;line-height:1.5;border-top:1px solid #3a2f73;padding-top:18px;\">Tota comparació retorna sempre un <strong style=\"color:#fff;\">booleà<\u002Fstrong>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Exercici · branca\" data-screen-label=\"Exercici quina branca\" data-speaker-notes=\"2 minuts. temperatura = 7. Comprovem: ≥30? no. ≥20? no. ≥10? no. else → 'fred'. La clau és que s'avaluen en ordre i para a la primera certa. Resposta: 'fred'.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:18px;\"><span style=\"font-family:'Press Start 2P',cursive;font-size:12px;color:#05140d;background:#5ef58c;padding:6px 16px;border-radius:0;letter-spacing:.1em;\">EXERCICI<\u002Fspan><span style=\"font-family:'VT323',monospace;font-size:24px;color:#6f67a0;\">03 · CONDICIONS<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 40px;line-height:1.05;\">Amb <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">temperatura = 7<\u002Fspan>, quin text s'assigna?<\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;align-items:center;\">\n      <div style=\"flex:1.2;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:40px;font-family:'VT323',monospace;font-size:30px;line-height:1.85;\">\n        <div><span style=\"color:#5ef58c;\">si<\u002Fspan> temperatura ≥ 30 <span style=\"color:#5ef58c;\">llavors<\u002Fspan> avis ← \"calor\"<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">si no si<\u002Fspan> temperatura ≥ 20 <span style=\"color:#5ef58c;\">llavors<\u002Fspan> avis ← \"agradable\"<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">si no si<\u002Fspan> temperatura ≥ 10 <span style=\"color:#5ef58c;\">llavors<\u002Fspan> avis ← \"fresc\"<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">si no<\u002Fspan> avis ← \"fred\"<\u002Fdiv>\n        <div><span style=\"color:#5ef58c;\">fi si<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 340px;\">\n        <p style=\"font-size:30px;color:#9a93c9;line-height:1.5;margin:0;\">Avalua les condicions <strong style=\"color:#fff;\">en ordre<\u002Fstrong>. Recorda: el programa para a la primera que sigui certa.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"04 · Lògics\" data-screen-label=\"Secció 04 Operadors lògics\" data-speaker-notes=\"Quarta secció. Sovint una sola condició no n'hi ha prou; cal combinar-ne. Solució anterior: cap condició ≥ es compleix amb 7, així que avis = 'fred'.\" style=\"height:100%;box-sizing:border-box;background:#1a0b2e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;justify-content:center;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:118px;font-weight:400;color:#5ef58c;line-height:1;letter-spacing:-0.02em;\">04<\u002Fdiv>\n    <h2 style=\"font-family:'Press Start 2P',cursive;font-size:40px;font-weight:400;margin:20px 0 0;line-height:1.25;\">Operadors lògics<\u002Fh2>\n    <p style=\"font-size:36px;color:#9a93c9;margin:24px 0 0;max-width:60%;\">Combinar diverses condicions: <span style=\"font-family:'VT323',monospace;\">AND<\u002Fspan>, <span style=\"font-family:'VT323',monospace;\">OR<\u002Fspan>, <span style=\"font-family:'VT323',monospace;\">NOT<\u002Fspan>.<\u002Fp>\n    <div style=\"margin-top:34px;font-family:'VT323',monospace;font-size:26px;color:#6f67a0;\">solució exercici anterior → avis = \"fred\"<\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"AND OR NOT\" data-screen-label=\"AND OR NOT\" data-speaker-notes=\"Tres operadors. AND: cert només si totes dues són certes (exigent). OR: cert si almenys una ho és (generós). NOT: inverteix. Pensa-ho amb el llenguatge natural: «i», «o», «no».\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">04 · OPERADORS LÒGICS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 44px;line-height:1.05;\">Tres maneres de combinar veritats<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:30px;flex:1;align-content:center;\">\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:38px;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:38px;color:#5ef58c;font-weight:700;\">AND<\u002Fdiv>\n        <div style=\"font-size:28px;color:#d7d2ff;line-height:1.4;\">Cert només si <strong style=\"color:#fff;\">totes dues<\u002Fstrong> són certes.<\u002Fdiv>\n        <div style=\"font-size:26px;color:#9a93c9;margin-top:auto;line-height:1.4;\">«té entrada <span style=\"color:#5ef58c;\">i<\u002Fspan> és major d'edat»<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:38px;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:38px;color:#5ef58c;font-weight:700;\">OR<\u002Fdiv>\n        <div style=\"font-size:28px;color:#d7d2ff;line-height:1.4;\">Cert si <strong style=\"color:#fff;\">almenys una<\u002Fstrong> és certa.<\u002Fdiv>\n        <div style=\"font-size:26px;color:#9a93c9;margin-top:auto;line-height:1.4;\">«paga amb targeta <span style=\"color:#5ef58c;\">o<\u002Fspan> en efectiu»<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:38px;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:38px;color:#5ef58c;font-weight:700;\">NOT<\u002Fdiv>\n        <div style=\"font-size:28px;color:#d7d2ff;line-height:1.4;\"><strong style=\"color:#fff;\">Inverteix<\u002Fstrong>: cert passa a fals i a l'inrevés.<\u002Fdiv>\n        <div style=\"font-size:26px;color:#9a93c9;margin-top:auto;line-height:1.4;\">«<span style=\"color:#5ef58c;\">no<\u002Fspan> està ple»<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Taules de veritat\" data-screen-label=\"Taules de veritat\" data-speaker-notes=\"La taula de veritat llista TOTES les combinacions d'entrada i el resultat. Amb 2 entrades hi ha 4 files (2 elevat a 2). És la definició formal i completa de cada operador: no hi ha ambigüitat.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">04 · OPERADORS LÒGICS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 18px;line-height:1.05;\">Taules de veritat<\u002Fh2>\n    <p style=\"font-size:28px;color:#9a93c9;margin:0 0 34px;\">Cada operador queda definit sense ambigüitat: totes les combinacions i el seu resultat. Fem servir <span style=\"font-family:'VT323',monospace;color:#5ef58c;\">1 = cert<\u002Fspan>, <span style=\"font-family:'VT323',monospace;\">0 = fals<\u002Fspan>.<\u002Fp>\n    <div style=\"display:flex;gap:40px;flex:1;justify-content:center;align-items:center;\">\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:30px 36px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:32px;color:#5ef58c;text-align:center;margin-bottom:18px;font-weight:700;\">AND<\u002Fdiv>\n        <table style=\"border-collapse:collapse;font-family:'VT323',monospace;font-size:30px;\">\n          <thead><tr style=\"color:#9a93c9;font-size:26px;\"><th style=\"padding:8px 22px;font-weight:500;\">A<\u002Fth><th style=\"padding:8px 22px;font-weight:500;\">B<\u002Fth><th style=\"padding:8px 22px;font-weight:500;color:#5ef58c;\">A·B<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody style=\"text-align:center;\">\n            <tr><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 22px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 22px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 22px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 22px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 22px;color:#5ef58c;font-weight:700;\">1<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:30px 36px;\">\n        <div style=\"font-family:'VT323',monospace;font-size:32px;color:#5ef58c;text-align:center;margin-bottom:18px;font-weight:700;\">OR<\u002Fdiv>\n        <table style=\"border-collapse:collapse;font-family:'VT323',monospace;font-size:30px;\">\n          <thead><tr style=\"color:#9a93c9;font-size:26px;\"><th style=\"padding:8px 22px;font-weight:500;\">A<\u002Fth><th style=\"padding:8px 22px;font-weight:500;\">B<\u002Fth><th style=\"padding:8px 22px;font-weight:500;color:#5ef58c;\">A+B<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody style=\"text-align:center;\">\n            <tr><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 22px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 22px;color:#5ef58c;font-weight:700;\">1<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 22px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 22px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 22px;color:#5ef58c;font-weight:700;\">1<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 22px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 22px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 22px;color:#5ef58c;font-weight:700;\">1<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div style=\"background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:30px 36px;align-self:center;\">\n        <div style=\"font-family:'VT323',monospace;font-size:32px;color:#5ef58c;text-align:center;margin-bottom:18px;font-weight:700;\">NOT<\u002Fdiv>\n        <table style=\"border-collapse:collapse;font-family:'VT323',monospace;font-size:30px;\">\n          <thead><tr style=\"color:#9a93c9;font-size:26px;\"><th style=\"padding:8px 26px;font-weight:500;\">A<\u002Fth><th style=\"padding:8px 26px;font-weight:500;color:#5ef58c;\">¬A<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody style=\"text-align:center;\">\n            <tr><td style=\"padding:8px 26px;color:#6f67a0;\">0<\u002Ftd><td style=\"padding:8px 26px;color:#5ef58c;font-weight:700;\">1<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 26px;color:#fff;\">1<\u002Ftd><td style=\"padding:8px 26px;color:#6f67a0;\">0<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Combinar\" data-screen-label=\"Combinar condicions\" data-speaker-notes=\"Exemple realista: control d'accés a una sala. Pots entrar si ets soci I (tens reserva O queden places lliures). Mostra com els parèntesis agrupen també a la lògica, igual que a l'aritmètica.\" style=\"height:100%;box-sizing:border-box;background:#0e0b1e;color:#e8e6ff;font-family:'VT323',monospace;padding:90px 110px;display:flex;flex-direction:column;\">\n    <div style=\"font-family:'Press Start 2P',cursive;font-size:13px;color:#5ef58c;letter-spacing:.14em;margin-bottom:18px;\">04 · OPERADORS LÒGICS<\u002Fdiv>\n    <h2 style=\"font-size:60px;font-weight:600;margin:0 0 44px;line-height:1.05;\">Combinar condicions amb parèntesis<\u002Fh2>\n    <div style=\"display:flex;gap:48px;flex:1;align-items:center;\">\n      <div style=\"flex:1;background:#1c1640;border:1px solid #3a2f73;border-radius:0;padding:44px;font-family:'VT323',monospace;font-size:31px;line-height:1.9;\">\n
